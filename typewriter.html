<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="preload" href="fonts/Staatliches-Regular.ttf" as="font" type="font/ttf" crossorigin />
        <link rel="preload" href="fonts/DMSans.ttf" as="font" type="font/ttf" crossorigin />
        <link rel="stylesheet" href="styles/style.css" />
        <link rel="stylesheet" href="styles/style_typewriter.css" />
    </head>

    <body>
        <div class="word-dj-set-wrapper">
            <div class="word">
            </div>
        </div>
        <script type="module">
        import { initWordDisplay } from "./scripts/typewriter_common.js";
        
        // Wait for fonts to load before initializing text display
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => {
                initWordDisplay(".word");
            });
        } else {
            // Fallback for older browsers
            window.addEventListener("load", () => {
                initWordDisplay(".word");
            });
        }
    </script>
    </body>
</html>
